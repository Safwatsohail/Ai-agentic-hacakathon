[project]
name = "personalized-discord-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2025.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
discord = ["discord.py>=2.4"]
adk = ["google-adk>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
