services:
  db:
    image: postgres:15-alpine
    container_name: orchestr_db
    environment:
      POSTGRES_USER: orchestr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackathon_secret}
      POSTGRES_DB: orchestr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestr -d orchestr_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: orchestr_backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://orchestr:${POSTGRES_PASSWORD:-hackathon_secret}@db:5432/orchestr_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ${GOOGLE_CREDENTIALS_PATH:-../google_credentials.json}:/app/google_credentials.json:ro
    restart: unless-stopped

  sandbox:
    build:
      context: ../sandbox
    container_name: orchestr_sandbox
    env_file:
      - ../.env
    depends_on:
      - backend
    volumes:
      - ../sandbox:/app
      - ${GOOGLE_CREDENTIALS_PATH:-../google_credentials.json}:/app/google_credentials.json:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: orchestr_caddy
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../build:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config: